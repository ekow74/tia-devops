name: DevOps CI

on:
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'catalog/**'
      - 'ksp-bootstrap/**'
      - 'KSP_DEVOPS_UMBRELLA.md'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'catalog/**'
      - 'ksp-bootstrap/**'
      - 'KSP_DEVOPS_UMBRELLA.md'
  workflow_dispatch:

concurrency:
  group: devops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Fast deterministic gate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate umbrella
        shell: bash
        run: bash scripts/ci/validate_devops_umbrella.sh

  workflow-security:
    name: Workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit active GitHub workflows with zizmor (block HIGH)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
          min-severity: high
          version: v1.30.1

  dependency-vulnerability-review:
    name: KSP bootstrap vulnerability gate (zero-cost fallback)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan KSP bootstrap dependency surface
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ksp-bootstrap
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

# The historical umbrella contains unrelated training/reference material and is
# scanned by security-deep.yml. The future private ksp-platform repository will
# scan its complete production tree here because it will contain no legacy corpus.
