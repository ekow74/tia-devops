name: KSP S02 Safety Gates

on:
  pull_request:
    paths:
      - 'ksp-bootstrap/**'
      - 'packages/validators/**'
      - 'packages/policies/**'
      - 'governance/**'
      - 'domain-packs/**'
      - 'knowledge-packs/qualification/**'
      - 'qa/mutation/**'
      - 'qa/retrieval/**'
      - 'platform/terraform/**'
      - 'platform/compose/**'
      - 'platform/ansible/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ksp-s02-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-safety:
    name: Credential-free static safety gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KSP_PR_PATH: untrusted
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Terraform static policy - production paths
        shell: bash
        run: python3 ksp-bootstrap/scripts/ci/check_terraform_static.py

      - name: Terraform policy fixtures
        shell: bash
        run: |
          python3 ksp-bootstrap/scripts/ci/check_terraform_static.py ksp-bootstrap/tests/fixtures/terraform/safe
          if python3 ksp-bootstrap/scripts/ci/check_terraform_static.py ksp-bootstrap/tests/fixtures/terraform/unsafe_external; then
            echo 'unsafe external-data fixture unexpectedly passed' >&2
            exit 1
          fi
          if python3 ksp-bootstrap/scripts/ci/check_terraform_static.py ksp-bootstrap/tests/fixtures/terraform/unsafe_unpinned_module; then
            echo 'unsafe unpinned-module fixture unexpectedly passed' >&2
            exit 1
          fi
          echo 'terraform-policy-fixtures: PASS'

      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Terraform HCL formatting/syntax
        shell: bash
        run: terraform -chdir=ksp-bootstrap/terraform fmt -check -recursive

      - name: A2-T06c real Terraform indexed-address witness
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/ksp-tf-index-witness
          mkdir -p "$work"
          cat >"$work/main.tf" <<'HCL'
          terraform {
            required_version = ">= 1.16.0, < 1.17.0"
          }
          variable "instances" { type = number }
          resource "terraform_data" "ksp_prototype" {
            count = var.instances
            input = "indexed-witness"
          }
          HCL
          terraform -chdir="$work" init -backend=false -input=false >/dev/null
          terraform -chdir="$work" apply -auto-approve -input=false -var='instances=1' >/dev/null
          terraform -chdir="$work" plan -input=false -var='instances=0' -out=delete.tfplan >/dev/null
          terraform -chdir="$work" show -json delete.tfplan >"$work/plan.json"
          python3 - "$work/plan.json" <<'PY'
          import json, sys
          plan=json.load(open(sys.argv[1], encoding='utf-8'))
          matches=[r for r in plan.get('resource_changes', []) if r.get('address') == 'terraform_data.ksp_prototype[0]']
          if len(matches) != 1: raise SystemExit(f'expected one indexed Terraform address, got {len(matches)}')
          r=matches[0]
          assert r.get('type') == 'terraform_data', r
          assert r.get('name') == 'ksp_prototype', r
          assert 'delete' in set((r.get('change') or {}).get('actions', [])), r
          print('A2-T06c terraform-show-json witness address:', r['address'])
          PY
          if python3 ksp-bootstrap/scripts/ci/classify_tf_plan.py "$work/plan.json" ksp-bootstrap/tests/fixtures/terraform-plan/protected-witness.json; then
            echo 'A2-T06c FAIL: destructive plan unexpectedly returned success' >&2
            exit 1
          else
            rc=$?
            if [[ "$rc" -ne 42 ]]; then
              echo "A2-T06c FAIL: classifier exit=$rc expected 42" >&2
              exit 1
            fi
          fi
          echo 'A2-T06c-INDEXED: PASS real terraform show -json classified DESTRUCTIVE'

      - name: Compose published-port and bypass policy - production paths
        shell: bash
        run: python3 ksp-bootstrap/scripts/ci/check_compose_bindings.py

      - name: Compose binding and bypass fixtures
        shell: bash
        run: |
          python3 ksp-bootstrap/scripts/ci/check_compose_bindings.py ksp-bootstrap/tests/fixtures/compose/safe.yaml
          for unsafe in \
            unsafe.yaml \
            unsafe_unbound.yaml \
            unsafe_host_network.yaml \
            unsafe_privileged.yaml \
            unsafe_docker_socket.yaml; do
            if python3 ksp-bootstrap/scripts/ci/check_compose_bindings.py "ksp-bootstrap/tests/fixtures/compose/$unsafe"; then
              echo "unsafe Compose fixture unexpectedly passed: $unsafe" >&2
              exit 1
            fi
          done
          echo 'compose-policy-fixtures: PASS including host-network/privileged/socket bypasses'

      - name: Prove credential-free PR path
        shell: bash
        run: |
          test -z "${CNTB_OAUTH2_CLIENT_ID:-}"
          test -z "${CNTB_OAUTH2_CLIENT_SECRET:-}"
          test -z "${CNTB_OAUTH2_USER:-}"
          test -z "${CNTB_OAUTH2_PASS:-}"
          test -z "${TFC_TOKEN:-}"
          test -z "${TF_TOKEN_app_terraform_io:-}"
          test -z "${CONTABO_CLIENT_ID:-}"
          test -z "${CONTABO_CLIENT_SECRET:-}"
          echo 'credential-free-pr-path: PASS'

      - name: Gate integrity / independent approval
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 ksp-bootstrap/scripts/ci/check_gate_integrity.py \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.event.pull_request.head.sha }}'
