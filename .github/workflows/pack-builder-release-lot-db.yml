name: KSP Pack Builder Release-Lot DB Qualification

on:
  pull_request:
    paths:
      - 'ksp-pack-builder/**'
      - '.github/workflows/pack-builder-release-lot-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksp-pack-builder-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres18-release-lot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ksp-ci-only
          POSTGRES_DB: ksp_pack_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ksp_pack_builder"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      PGPASSWORD: ksp-ci-only
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ksp_pack_builder

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Assert PostgreSQL 18 runtime
        shell: bash
        run: |
          set -euo pipefail
          version_num=$(psql "$DATABASE_URL" -Atc 'SHOW server_version_num')
          version_text=$(psql "$DATABASE_URL" -Atc 'SELECT version()')
          echo "server_version_num=$version_num"
          echo "$version_text"
          if (( version_num < 180000 || version_num >= 190000 )); then
            echo "expected PostgreSQL 18.x, got $version_num" >&2
            exit 1
          fi

      - name: Load S06-compatible release-lot schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -f ksp-pack-builder/tests/release_lot_fixture_schema.sql

      - name: Apply Pack Builder release-lot controls
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -f ksp-pack-builder/sql/release_lot_controls.sql

      - name: Run RL1/RL2/RL4/RL5 and positive-path regressions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -f ksp-pack-builder/tests/release_lot_regression.sql

      - name: Verify expected control objects
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -At <<'SQL' | sort > /tmp/triggers.txt
          SELECT tgname
          FROM pg_trigger
          WHERE NOT tgisinternal
            AND tgname IN (
              'trg_release_lot_claim_mutation',
              'trg_release_lot_state_transition',
              'trg_claim_revision_release_lot_quarantine'
            );
          SQL
          diff -u <(printf '%s\n' \
            trg_claim_revision_release_lot_quarantine \
            trg_release_lot_claim_mutation \
            trg_release_lot_state_transition | sort) /tmp/triggers.txt
          echo 'PACK_BUILDER_RELEASE_LOT_OBJECTS: PASS'
