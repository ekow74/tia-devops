services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
    profiles: ["chaos"]
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8474:8474"
    networks:
      - staging_app
      - chaos_mgmt

networks:
  staging_app:
    external: true
    name: ${KSP_STAGING_APP_NETWORK:-ksp_staging_app}
  chaos_mgmt:
    internal: true
